[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "photara-rs"
dynamic = ["version"]
description = "OptiX and Metal physically based renderer derived from Cycles"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.11,<3.14"
authors = [{name = "Photara"}]
keywords = ["renderer", "optix", "path tracing", "sim2real", "synthetic data"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: Microsoft :: Windows :: Windows 10",
    "Operating System :: Microsoft :: Windows :: Windows 11",
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Graphics :: 3D Rendering",
]
dependencies = ["numpy>=1.23"]

[project.optional-dependencies]
png = ["Pillow>=9"]

[project.urls]
Homepage = "https://github.com/fenghuayumo/photara-studio"

[tool.setuptools]
packages = ["photara_rs", "photara_rs.importers"]
zip-safe = false

[tool.setuptools.package-data]
photara_rs = ["VERSION", "*.pyd", "*.so", "bin/*.dll", "lib/*.zst", "lib/*.dylib*", "source/**/*.h", "source/**/*.metal", "py.typed"]
